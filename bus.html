<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bus Ticket Booking</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #8fd3f4 0%, #fceabb 100%);
      margin: 0;
      padding: 0;
      color: #222;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px #0002;
      padding: 30px 40px;
    }
    h2 {
      text-align: center;
      color: #1e90ff;
    }
    form {
      margin-top: 20px;
      padding: 20px;
      background: #fafdff;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
    }
    label {
      display: block;
      margin: 12px 0 4px 0;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #b0c4de;
      border-radius: 5px;
      font-size: 1em;
      background: #fafdff;
    }
    button {
      background: #1e90ff;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover {
      background: #005fa3;
    }
    #confirmation {
      display: none;
      background: #e6ffe6;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
      color: #1b7e1b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Bus Ticket Booking</h2>
    <form id="bus-booking-form">

      <label for="bus-name">Bus Name</label>
      <select id="bus-name" name="bus-name" required>
        <option value="">--Select Bus--</option>
        <option value="VRL Travels">VRL Travels</option>
        <option value="SRS Travels">SRS Travels</option>
        <option value="KSRTC">KSRTC</option>
        <option value="RedBus">RedBus</option>
        <option value="Neeta Travels">Neeta Travels</option>
      </select>
      
      <label for="from">From</label>
      <select id="from" name="from" required>
        <option value="">--Select City--</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Pune">Pune</option>
        <option value="Delhi">Delhi</option>
        <option value="Bangalore">Bangalore</option>
      </select>

      

      <label for="to">To</label>
      <select id="to" name="to" required>
        <option value="">--Select City--</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Pune">Pune</option>
        <option value="Delhi">Delhi</option>
        <option value="Bangalore">Bangalore</option>
      </select>

      <label for="date">Date of Journey</label>
      <input type="date" id="date" name="date" required>

      <label for="bus-type">Bus Type</label>
      <select id="bus-type" name="bus-type" required>
        <option value="">--Select Bus Type--</option>
        <option value="AC Sleeper">AC Sleeper</option>
        <option value="Non-AC Sleeper">Non-AC Sleeper</option>
        <option value="AC Seater">AC Seater</option>
        <option value="Non-AC Seater">Non-AC Seater</option>
      </select>

      <label for="seat">Seat Preference</label>
      <select id="seat" name="seat" required>
        <option value="">--Select Seat--</option>
        <option value="Window">Window</option>
        <option value="Aisle">Aisle</option>
        <option value="Middle">Middle</option>
      </select>

      <label for="price">Price (₹)</label>
      <input type="text" id="price" name="price" readonly style="background:#f0f0f0;">

      <button type="submit">Book Ticket</button>
    </form>

    <div id="confirmation">
      <h3>Booking Confirmed!</h3>
      <p id="confirm-details"></p>
      <p><strong>Booking ID:</strong> <span id="booking-id"></span></p>
    </div>
  </div>
  <script>
    // Simple price logic based on bus type
    function getPrice(busType) {
      switch(busType) {
        case "AC Sleeper": return 1200;
        case "Non-AC Sleeper": return 900;
        case "AC Seater": return 800;
        case "Non-AC Seater": return 600;
        default: return "";
      }
    }

    document.getElementById('bus-type').addEventListener('change', function() {
      document.getElementById('price').value = getPrice(this.value);
    });

    document.getElementById('bus-booking-form').onsubmit = function(e) {
      e.preventDefault();
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const date = document.getElementById('date').value;
      const busName = document.getElementById('bus-name').value;
      const busType = document.getElementById('bus-type').value;
      const seat = document.getElementById('seat').value;
      const price = document.getElementById('price').value;
      // Generate a simple booking ID
      const bookingId = 'BUS' + Math.floor(100000 + Math.random() * 900000);
      document.getElementById('confirmation').style.display = 'block';
      document.getElementById('confirm-details').innerText =
        `Your ticket on ${busName} from ${from} to ${to} on ${date} (${busType}, Seat: ${seat}) is confirmed.\nPrice: ₹${price}`;
      document.getElementById('booking-id').innerText = bookingId;
      document.getElementById('bus-booking-form').reset();
      document.getElementById('price').value = "";
    };
  </script>
</body>
