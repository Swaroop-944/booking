<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #fceabb 0%, #8fd3f4 100%);
      margin: 0;
      padding: 0;
      color: #222;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fcf7f7;
      border-radius: 16px;
      box-shadow: 0 8px 32px #0002;
      padding: 30px 40px;
    }
    h2 {
      text-align: center;
      color: #1e90ff;
    }
    form {
      margin-top: 20px;
      padding: 20px;
      background: #fafdff;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
    }
    label {
      display: block;
      margin: 12px 0 4px 0;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #b0c4de;
      border-radius: 5px;
      font-size: 1em;
      background: #fafdff;
    }
    button {
      background: #1e90ff;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover {
      background: #005fa3;
    }
    #confirmation {
      display: none;
      background: #e6ffe6;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
      color: #1b7e1b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hotel Booking</h2>
    <form id="hotel-booking-form">
      <label for="hotel-name">Hotel Name</label>
      <select id="hotel-name" name="hotel-name" required>
        <option value="">--Select Hotel--</option>
        <option value="The Taj Mahal Palace">The Taj Mahal Palace</option>
        <option value="Oberoi Mumbai">Oberoi Mumbai</option>
        <option value="Leela Palace Delhi">Leela Palace Delhi</option>
        <option value="JW Marriott Bangalore">JW Marriott Bangalore</option>
        <option value="ITC Grand Goa">ITC Grand Goa</option>
      </select>

      <label for="from-place">From Place</label>
      <select id="from-place" name="from-place" required>
        <option value="">--Select Place--</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Delhi">Delhi</option>
        <option value="Bangalore">Bangalore</option>
        <option value="Goa">Goa</option>
        <option value="Jaipur">Jaipur</option>
      </select>

      <label for="checkin">Check-In Date</label>
      <input type="date" id="checkin" name="checkin" required>

      <label for="checkout">Check-Out Date</label>
      <input type="date" id="checkout" name="checkout" required>

      <label for="room-type">Room Type</label>
      <select id="room-type" name="room-type" required>
        <option value="">--Select Room Type--</option>
        <option value="Premium">Premium</option>
        <option value="Local">Local</option>
        <option value="Suite">Suite</option>
        <option value="Deluxe">Deluxe</option>
        <option value="Standard">Standard</option>
      </select>

      <label for="guests">Number of Guests</label>
      <input type="number" id="guests" name="guests" min="1" max="10" required>

      <label for="id-proof">ID Proof</label>
      <select id="id-proof" name="id-proof" required>
        <option value="">--Select ID Proof--</option>
        <option value="Aadhar Card">Aadhar Card</option>
        <option value="PAN Card">PAN Card</option>
        <option value="Passport">Passport</option>
        <option value="Driving License">Driving License</option>
        <option value="Voter ID">Voter ID</option>
      </select>

      <label for="id-number">ID Number</label>
      <input type="text" id="id-number" name="id-number" required>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" pattern="[6-9]\d{9}" maxlength="10" required>

      <label for="price">Price (₹)</label>
      <input type="text" id="price" name="price" readonly style="background:#f0f0f0;">

      <button type="submit">Book Hotel</button>
    </form>

    <div id="confirmation">
      <h3>Booking Confirmed!</h3>
      <p id="confirm-details"></p>
      <p><strong>Booking ID:</strong> <span id="booking-id"></span></p>
    </div>
  </div>
  <script>
    // Simple price logic based on room type
    function getPrice(roomType) {
      switch(roomType) {
        case "Premium": return 5000;
        case "Suite": return 4000;
        case "Deluxe": return 3000;
        case "Standard": return 2000;
        case "Local": return 1200;
        default: return "";
      }
    }

    document.getElementById('room-type').addEventListener('change', function() {
      document.getElementById('price').value = getPrice(this.value);
    });

    document.getElementById('hotel-booking-form').onsubmit = function(e) {
      e.preventDefault();
      const hotel = document.getElementById('hotel-name').value;
      const fromPlace = document.getElementById('from-place').value;
      const checkin = document.getElementById('checkin').value;
      const checkout = document.getElementById('checkout').value;
      const roomType = document.getElementById('room-type').value;
      const guests = document.getElementById('guests').value;
      const idProof = document.getElementById('id-proof').value;
      const idNumber = document.getElementById('id-number').value;
      const mobile = document.getElementById('mobile').value;
      const price = document.getElementById('price').value;
      // Generate a simple booking ID
      const bookingId = 'HOTEL' + Math.floor(100000 + Math.random() * 900000);
      document.getElementById('confirmation').style.display = 'block';
      document.getElementById('confirm-details').innerText =
        `Hotel: ${hotel}
From: ${fromPlace}
Check-In: ${checkin}
Check-Out: ${checkout}
Room Type: ${roomType}
Guests: ${guests}
ID Proof: ${idProof} (${idNumber})
Mobile: ${mobile}
Price: ₹${price}
Your hotel booking is confirmed!`;
      document.getElementById('booking-id').innerText = bookingId;
      document.getElementById('hotel-booking-form').reset();
      document.getElementById('price').value = "";
    };
  </script>
