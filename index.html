<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Ticket Booking Portal</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #fceabb 0%, #8fd3f4 100%);
      margin: 0;
      padding: 0;
      color: #222;
    }
    header {
      background: #222;
      color: #fff;
      padding: 30px 0 20px 0;
      text-align: center;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px #0002;
      padding: 30px 40px;
      text-align: center;
    }
    .booking-options {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      gap: 30px;
    }
    .option-card {
      background: #fafdff;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
      padding: 24px 18px;
      width: 180px;
      transition: box-shadow 0.2s;
      text-align: center;
    }
    .option-card:hover {
      box-shadow: 0 4px 16px #8fd3f4;
    }
    .option-card img {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      margin-bottom: 12px;
      object-fit: cover;
      border: 2px solid #8fd3f4;
    }
    .option-card a {
      display: block;
      margin-top: 12px;
      padding: 8px 0;
      background: #8fd3f4;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .option-card a:hover {
      background: #222;
      color: #fff;
    }
    @media (max-width: 800px) {
      .booking-options {
        flex-direction: column;
        align-items: center;
      }
      .option-card {
        width: 80vw;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Online Ticket Booking Portal</h1>
    <p>Book your tickets for Hotels, Buses, and Movies easily!</p>
  </header>
  <div class="container">
    <h2>Select Booking Type</h2>
    <div class="booking-options">
      <div class="option-card">
        <img src="https://img.freepik.com/free-vector/flat-hotel-booking-background_23-2148142885.jpg" alt="Hotel">
        <h3>Hotel Booking</h3>
        <a href="hotel.html">Book Now</a>
      </div>
      <div class="option-card">
        <img src="https://cdn.dribbble.com/users/5980575/screenshots/14711625/bus-ride-booking-illustrations-329724_4x.png" alt="Bus">
        <h3>Bus Booking</h3>
        <a href="bus.html">Book Now</a>
      </div>
      <div class="option-card">
        <img src="https://kaliforms.com/wp-content/uploads/2021/04/movie-ticket-booking-form-scaled.jpg" alt="Movie">
        <h3>Movie Booking</h3>
        <a href="movie.html">Book Now</a>
      </div>
    </div>
  </div>
</body>
